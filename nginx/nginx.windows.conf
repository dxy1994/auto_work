# ============================================================
# Windows 物理机部署 - Nginx 配置
# 使用方式：将此文件复制到 nginx安装目录/conf/nginx.conf
# 或 nginx安装目录/conf.d/auto.conf（需在主配置中 include）
# ============================================================

# Windows 下 nginx 工作进程数建议设为 1（Windows 不支持 worker_processes auto）
worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    # gzip 压缩，提升传输效率
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 1000;

    server {
        listen 80;
        server_name localhost;

        # ── 前端静态资源 ─────────────────────────────────────────
        # 指向项目 frontend/dist 构建产物目录（请根据实际路径修改）
        root   D:/work/auto/frontend/dist;
        index  index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }

        # ── API 反向代理到后端（FastAPI uvicorn 8000 端口） ─────
        location /api/ {
            proxy_pass http://127.0.0.1:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # 上传文件可能较大，增加超时和 body 限制
            client_max_body_size 20m;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }

        # ── WebSocket 反向代理（自动化任务实时推送） ─────────────
        location /api/automation/ws/ {
            proxy_pass http://127.0.0.1:8000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 86400s;  # WebSocket 长连接保持 24h
        }

        # ── 上传文件静态资源代理 ─────────────────────────────────
        location /uploads/ {
            proxy_pass http://127.0.0.1:8000;
            proxy_set_header Host $host;
        }
    }
}
