server:
  port: ${API_PORT:8000}

spring:
  application:
    name: auto-backend
  datasource:
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:auto_login}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-test-query: SELECT 1
      max-lifetime: 3600000
  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: always
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
  servlet:
    multipart:
      max-file-size: 2GB
      max-request-size: 2050MB

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  global-config:
    banner: false
    db-config:
      id-type: auto
  configuration:
    map-underscore-to-camel-case: true

# 应用自定义配置
app:
  # AES 加密密钥（32字节，与原 Python 后端 backend/.env 保持一致以兼容历史加密数据）
  secret-key: ${SECRET_KEY:your-32-byte-secret-key-change-this!}
  # CORS 允许来源（* 表示允许任意来源）
  cors-origins: ${CORS_ORIGINS:*}
  # 对象存储（RustFS / S3 兼容）
  storage:
    endpoint: ${STORAGE_ENDPOINT:http://127.0.0.1:9000}
    region: ${STORAGE_REGION:us-east-1}
    access-key: ${STORAGE_ACCESS_KEY:rustfsadmin}
    secret-key: ${STORAGE_SECRET_KEY:rustfsadmin}
    bucket: ${STORAGE_BUCKET:auto-uploads}
    public-base-url: ${STORAGE_PUBLIC_BASE_URL:}
    path-style-access: ${STORAGE_PATH_STYLE:true}

logging:
  level:
    root: INFO
